<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ورود مشتری | کیمیا</title>
  <style>
    @font-face{font-family:Estedad;src:url('/fonts/Estedad-wght.woff2') format('woff2');font-weight:100 900;font-display:swap}
    :root{--bg:#070f0c;--panel:#10271d;--gold:#d8b675;--text:#f5f0e7;--muted:#d0c8bb}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.8 Estedad,Tahoma,sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(460px,100%);background:var(--panel);border:1px solid rgba(216,182,117,.3);border-radius:18px;padding:clamp(20px,5vw,32px)}
    h1{margin:0 0 12px;color:var(--gold);font-size:clamp(23px,6vw,28px)}p{margin:8px 0}.field{margin:14px 0}label{display:block;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #dcd1c2;border-radius:10px;font:inherit;direction:ltr}button{width:100%;min-height:48px;margin-top:12px;padding:10px 12px;border:0;border-radius:10px;background:var(--gold);color:#0f1d16;font:600 15px Estedad,Tahoma,sans-serif;cursor:pointer}button:disabled{opacity:.65;cursor:not-allowed}.secondary{background:#263e32;color:var(--text)}
    [hidden]{display:none!important}.status{min-height:28px;margin-top:12px;color:var(--muted)}.links{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.links a{color:var(--gold);text-underline-offset:3px}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}
    @media(max-width:360px){.links{flex-direction:column}}
  </style>
</head>
<body>
<main><section class="panel" aria-labelledby="title">
  <h1 id="title">ورود یا ثبت‌نام مشتری</h1>
  <p>برای ادامه، شمارهٔ همراه خود را وارد کنید. کد تأیید برای هر شماره با محدودیت زمانی ارسال می‌شود.</p>
  <form id="phoneForm">
    <div class="field"><label for="phone">شمارهٔ موبایل</label><input id="phone" name="phone" autocomplete="tel" inputmode="tel" dir="ltr" required placeholder="09307897825" disabled></div>
    <button id="sendButton" type="submit" disabled>دریافت کد تأیید</button>
  </form>
  <form id="otpForm" hidden>
    <div class="field"><label for="otp">کد شش‌رقمی</label><input id="otp" name="otp" autocomplete="one-time-code" inputmode="numeric" dir="ltr" maxlength="6" required></div>
    <p id="attempts" aria-live="polite"></p>
    <button id="verifyButton" type="submit">تأیید کد</button>
    <button id="resendButton" class="secondary" type="button">ارسال مجدد کد</button>
    <button id="changePhone" class="secondary" type="button">اصلاح شمارهٔ همراه</button>
  </form>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <div class="links"><a href="/">بازگشت به سایت</a><a href="/privacy">حریم خصوصی</a></div>
</section></main>
<script>
let currentPhone='',cooldownTimer=null,cooldownUntil=0,submitting=false;
const phoneForm=document.getElementById('phoneForm');
const otpForm=document.getElementById('otpForm');
const status=document.getElementById('status');
const sendButton=document.getElementById('sendButton'),resendButton=document.getElementById('resendButton');
function digits(value){return String(value).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))}
function normalizePhone(value){const raw=digits(value).trim();return /^09[0-9]{9}$/.test(raw)?'+98'+raw.slice(1):raw}
async function postJson(path,payload){const response=await fetch(path,{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify(payload),cache:'no-store'});let body;try{body=await response.json()}catch{throw new Error('پاسخ سرویس معتبر نیست. دوباره تلاش کنید.')}return{response,body}}
function startCooldown(seconds){clearInterval(cooldownTimer);cooldownUntil=Date.now()+Math.max(0,seconds)*1000;const tick=()=>{const left=Math.max(0,Math.ceil((cooldownUntil-Date.now())/1000));resendButton.disabled=left>0||submitting;resendButton.textContent=left?`ارسال مجدد پس از ${left} ثانیه`:'ارسال مجدد کد';if(!left)clearInterval(cooldownTimer)};tick();if(seconds>0)cooldownTimer=setInterval(tick,1000)}
function showOtp(message){phoneForm.hidden=true;otpForm.hidden=false;document.getElementById('otp').focus();status.textContent=message}
async function requestCode(phone){if(submitting)return;submitting=true;sendButton.disabled=true;resendButton.disabled=true;status.textContent='در حال درخواست کد…';try{const{response,body}=await postJson('/api/auth/otp/send',{phone});if(response.ok){currentPhone=phone;showOtp('اگر پیامک را دریافت کردید، کد شش‌رقمی را وارد کنید. پس از پایان زمان انتظار می‌توانید کد دیگری بخواهید.');startCooldown(body.retry_after_seconds);return}if(body.code==='rate_limited'){currentPhone=phone;showOtp('درخواست کد فعلاً محدود است. اگر برای این شماره کدی دریافت کرده‌اید، آن را وارد کنید؛ در غیر این صورت پس از پایان زمان انتظار دوباره درخواست دهید.');startCooldown(body.retry_after_seconds);return}status.textContent=body.message||'درخواست کد انجام نشد.'}catch(error){status.textContent=error.message||'ارتباط با سرویس برقرار نشد.'}finally{submitting=false;sendButton.disabled=false;const left=Math.max(0,Math.ceil((cooldownUntil-Date.now())/1000));resendButton.disabled=left>0}}
phoneForm.addEventListener('submit',event=>{event.preventDefault();requestCode(normalizePhone(document.getElementById('phone').value))});
resendButton.addEventListener('click',()=>{if(currentPhone)requestCode(currentPhone)});
document.getElementById('changePhone').addEventListener('click',()=>{clearInterval(cooldownTimer);currentPhone='';document.getElementById('otp').value='';document.getElementById('attempts').textContent='';otpForm.hidden=true;phoneForm.hidden=false;status.textContent='شمارهٔ همراه را بررسی یا اصلاح کنید.';document.getElementById('phone').focus()});
otpForm.addEventListener('submit',async event=>{event.preventDefault();if(submitting||!currentPhone)return;const code=digits(document.getElementById('otp').value).trim();if(!/^[0-9]{6}$/.test(code)){status.textContent='کد شش‌رقمی را کامل وارد کنید.';return}submitting=true;document.getElementById('verifyButton').disabled=true;status.textContent='در حال بررسی کد…';try{const{response,body}=await postJson('/api/auth/otp/verify',{phone:currentPhone,code});if(!response.ok){status.textContent=body.message||'کد تأیید معتبر نیست.';if(Number.isInteger(body.remaining_attempts))document.getElementById('attempts').textContent=`تعداد تلاش باقی‌مانده: ${body.remaining_attempts}`;if(Number.isInteger(body.retry_after_seconds))startCooldown(body.retry_after_seconds);return}location.assign(body.is_new_user?'/register':'/account')}catch(error){status.textContent=error.message||'ارتباط با سرویس برقرار نشد.'}finally{submitting=false;document.getElementById('verifyButton').disabled=false}});
async function checkAvailability(){try{const response=await fetch('/api/auth/status',{headers:{accept:'application/json'},cache:'no-store'});const body=await response.json();if(response.ok&&body.enabled){document.getElementById('phone').disabled=false;sendButton.disabled=false;status.textContent='';return}if(body.reason==='missing_configuration'){status.textContent='ورود مشتری هنوز آماده نیست؛ سرویس پیامک یا تنظیمات لازم فعال نشده است.'}else{status.textContent=body.message||'ورود مشتری در این پیش‌نمایش فعال نیست.'}}catch{status.textContent='وضعیت سرویس ورود بررسی نشد. کمی بعد دوباره صفحه را بارگذاری کنید.'}}
window.addEventListener('pagehide',()=>{clearInterval(cooldownTimer);currentPhone='';document.getElementById('phone').value='';document.getElementById('otp').value='';document.getElementById('attempts').textContent=''});
window.addEventListener('pageshow',event=>{if(event.persisted)location.reload()});
checkAvailability();
</script>
</body>
</html>
