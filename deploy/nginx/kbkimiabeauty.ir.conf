server {
    listen 80;
    listen [::]:80;
    server_name kbkimiabeauty.ir www.kbkimiabeauty.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://kbkimiabeauty.ir$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.kbkimiabeauty.ir;

    ssl_certificate /etc/letsencrypt/live/kbkimiabeauty.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kbkimiabeauty.ir/privkey.pem;
    return 301 https://kbkimiabeauty.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kbkimiabeauty.ir;

    ssl_certificate /etc/letsencrypt/live/kbkimiabeauty.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kbkimiabeauty.ir/privkey.pem;
    server_tokens off;
    client_max_body_size 5m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
